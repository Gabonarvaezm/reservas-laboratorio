{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card-custom">

            <h2 class="fw-bold text-center mb-4">
                Registro Administrador
            </h2>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary-custom w-100 mt-3">
                    Registrarse
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
