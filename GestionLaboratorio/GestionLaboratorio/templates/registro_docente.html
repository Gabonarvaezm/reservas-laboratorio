{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-6">

        <div class="card-custom">

            <h2 class="fw-bold text-center mb-4">
                Registro Docente
            </h2>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Usuario
                    </label>

                    {{ form.username }}

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Contraseña
                    </label>

                    {{ form.password1 }}

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Confirmar contraseña
                    </label>

                    {{ form.password2 }}

                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mt-3">
                    Registrarse
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
