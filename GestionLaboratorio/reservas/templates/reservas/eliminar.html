{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card-custom text-center">

            <h2 class="fw-bold text-danger mb-4">
                Eliminar Reserva
            </h2>

            <p class="mb-4">
                ¿Seguro que deseas eliminar esta reserva?
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger w-100">
                    Sí, eliminar
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
